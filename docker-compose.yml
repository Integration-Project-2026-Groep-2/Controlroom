services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "${PORT_ELASTICSEARCH}:9200"
      - "${PORT_ELASTICSEARCH_TRANSPORT}:9300"
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    networks:
      - controlroom-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'" ]
      interval: 10s
      timeout: 5s
      retries: 10
  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    ports:
      - "${PORT_KIBANA}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - controlroom-network

  controlroom:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlroom
    depends_on:
      - elasticsearch
      - kibana
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:5672/
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PORT_KIBANA=${PORT_KIBANA}
      - CONTROLROOM_ES_USER=${CONTROLROOM_ES_USER}
      - CONTROLROOM_ES_PASS=${CONTROLROOM_ES_PASS}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL}
      - MONITORED_SERVICES=${MONITORED_SERVICES}
      - KIBANA_URL=http://kibana:5601
      - KIBANA_USERNAME=${KIBANA_USERNAME}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - DASHBOARD_USER=${DASHBOARD_USER}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - DASHBOARD_LOGS_ID=${DASHBOARD_LOGS_ID}
      - DATAVIEW_LOGS_ID=${DATAVIEW_LOGS_ID}
      - DASHBOARD_HEARTBEATS_ID=${DASHBOARD_HEARTBEATS_ID}
      - DATAVIEW_HEARTBEATS_ID=${DATAVIEW_HEARTBEATS_ID}
    networks:
      - controlroom-network
    restart: unless-stopped

networks:
  controlroom-network:
    driver: bridge

volumes:
  rabbitmq_data:
  elasticsearch:
    driver: local
